services:
  goeat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "file:/data/goeat.db"
      RECIPE_IMAGE_DIR: "/data/recipe-images"
      ITEM_IMAGE_DIR: "/data/item-images"
      TOOLS_DIR: "/data/tools"
      # Video recipe import: speech-to-text runs in the whisper container
      # below. Speech models are downloaded from Settings → AI Setup into the
      # shared whisper-models volume, mounted at the same path in both.
      WHISPER_URL: "http://whisper:8081"
      WHISPER_MODELS_DIR: "/models"
    ports:
      - "8081:8080"
    volumes:
      - goeat-data:/data
      - whisper-models:/models

  # Speech-to-text for video recipe import (whisper/Dockerfile). Internal
  # only, no published port: its /load endpoint reads any path it can see.
  # Starts once a speech model has been downloaded in Settings → AI Setup.
  # Remove this block (and WHISPER_URL above) to import videos from their
  # captions only.
  whisper:
    image: ghcr.io/queball1999/goeat-whisper:latest
    restart: unless-stopped
    environment:
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - whisper-models:/models:ro

  # Optional headless browsers for scraping (Settings -> Scraping). Comment
  # out either block if you don't need it.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    ports:
      - "3900:3000" # host port 3000 often falls in a Windows/WSL2 reserved range
    environment:
      TOKEN: ${RENDER_TOKEN:-change-me}
      CONCURRENT: 2
      TIMEOUT: 60000
      QUEUED: 5
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:3000/pressure?token=$$TOKEN\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Phoenix}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  goeat-data:
  whisper-models:
