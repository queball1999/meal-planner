name: Build Docker Image

# Multi-arch (amd64 + arm64) server image, pushed to GitHub Container Registry
# as ghcr.io/<owner>/<repo>. Tags, from the git tag:
#
#   v1.2.3      ->  1.2.3, 1.2, latest   (1.2 is skipped while major is 0)
#   v1.2.3-dev  ->  1.2.3-dev            (never moves latest)
#
# Called by build_manager.yaml after every other build passed, so a failed
# release never publishes an image, and by cache_warm.yaml, which builds from
# main without pushing an image, only the layer cache. Authenticates with
# GITHUB_TOKEN; the caller must grant packages: write.
#
# The layer cache lives in the registry (the :buildcache tag), not in the
# Actions cache: Actions caches are scoped to the ref, so a new tag could never
# read the cache a previous tag wrote.

on:
  workflow_call:

jobs:
  build-docker:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
        env:
          # Skip the .dockerbuild build-record artifact; the release job would
          # otherwise try to download it alongside the real artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: false
