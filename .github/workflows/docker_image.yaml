name: Build Docker Image

# Multi-arch (amd64 + arm64) server image, pushed to GitHub Container Registry
# as ghcr.io/<owner>/<repo>. Tags, from the git tag:
#
#   v1.2.3      ->  1.2.3, 1.2, latest   (1.2 is skipped while major is 0)
#   v1.2.3-dev  ->  1.2.3-dev            (never moves latest)
#
# Only called by build_manager.yaml, after every other build passed, so a
# failed release never publishes an image. Authenticates with GITHUB_TOKEN;
# the caller must grant packages: write.

on:
  workflow_call:

jobs:
  build-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
