name: Build Whisper Image

# The whisper.cpp server sidecar for video recipe import (whisper/Dockerfile),
# pushed to GitHub Container Registry as ghcr.io/<owner>/goeat-whisper with the
# same tags as the app image (docker_image.yaml):
#
#   v1.2.3      ->  1.2.3, 1.2, latest   (1.2 is skipped while major is 0)
#   v1.2.3-dev  ->  1.2.3-dev            (never moves latest)
#
# Unlike the app image, each architecture builds on its own native runner and
# the two are merged into one multi-arch tag afterwards: whisper.cpp is C++,
# and compiling it under QEMU emulation takes the better part of an hour.
#
# Called by build_manager.yaml (after every other build passed, so a failed
# release never publishes an image) and by cache_warm.yaml (builds from main,
# pushes only the layer cache). The caller must grant packages: write.

on:
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goeat-whisper

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the merge job below gives the two digests
      # their tags together, so a tag never points at one architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: whisper
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=whisper.cpp server for Go Eat video recipe import
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.ref_type == 'tag' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Record digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          # Not release-*: the release job downloads only those.
          name: whisper-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: whisper-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
