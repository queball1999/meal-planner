[package]
name = "goeat-desktop"
version = "0.1.0"
description = "Go Eat - budget-first meal planner, desktop edition"
authors = ["Quynn Bell"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
getrandom = "0.3"

[profile.release]
# Small installer: this crate is a thin launcher, so optimise for size.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
