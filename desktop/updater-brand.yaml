# QUpdateTool brand for the Go Eat desktop app (phase 15).
#
# Compiled into the updater by QUpdateTool's tools/build_branded.py in CI
# (.github/workflows/build_updater.yaml), together with gpg-public.asc beside
# this file. The release source and signing key are locked into the binary:
# a config.yaml dropped next to it can't point it anywhere else.
#
# Go Eat starts the updater itself (About -> Updates -> Install) and passes
# what only it knows: --current-version, --calling-pid (the desktop shell),
# --executable, --log-file, and for the portable zip --asset-pattern.

app:
  name: Go Eat
  publisher: Quynn Bell
  support_url: https://github.com/queball1999/meal-planner/issues
  # The desktop shell only. NOT "goeat": that is also the name of a Go Eat
  # server binary, and process names match machine-wide - a .deb update runs
  # as root and would stop a server running on the same machine. The goeat
  # sidecar shuts itself down when the shell exits (its stdin closes).
  process_names:
    - Go Eat.exe
    - goeat-desktop

source:
  provider: github
  repo: queball1999/meal-planner
  channel: stable
  # Release tags only. -dev tags are prereleases and -windows / -linux tags
  # never make a release, but this keeps it that way if either changes.
  tag_pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

assets:
  # Left to platform detection, which picks:
  #   Windows installer -> GoEat-*-windows-x64-setup.exe
  #   Debian / Ubuntu   -> GoEat-*-linux-amd64.deb
  #   AppImage          -> GoEat-*-linux-amd64.AppImage (when run from one)
  # The portable zip is chosen by Go Eat passing --asset-pattern.
  preference: []
  # Never the server builds: GoEat-*-server-windows-amd64.zip would otherwise
  # be a candidate for the Windows zip fallback.
  exclude_pattern: "server"

security:
  require_signature: true
  require_checksum: true
  checksum_file: SHA256SUMS.txt
  signature_suffixes: [".sig", ".asc"]
  # The key itself is compiled in from gpg-public.asc (--key). Both the
  # primary key and its signing subkey, since either may sign a release.
  allowed_fingerprints:
    - 0E33B487E4193A20AB494B29F70C9E44B78E7B7C
    - ECE5FCEFD34AE17664F1C6F897CDE457CD97410F

install:
  mode: silent
  # The NSIS installer is per-user, so Windows needs no admin prompt; the
  # .deb does, and asks.
  elevate: auto

process:
  stop_parent: true
  stop_timeout: 30
  relaunch: true
  wait_before_relaunch: 2

notes:
  # Go Eat has no notices/ folder or CHANGELOG; the GitHub release body is
  # where its notes live.
  source: release

ui:
  window_title: Go Eat Updater
  accent_color: "#43a047"
  auto_close_seconds: 3

logging:
  level: INFO
  file: ""

lock:
  - source.channel
  - source.tag_pattern
  - install.elevate
  - assets.exclude_pattern
